[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketing-analytics-agent"
version = "0.1.0"
description = "A semantic-layer-grounded marketing analytics agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Camilo" }
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
marketing-agent = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
