[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketing-analytics-agent"
version = "0.1.0"
description = "A semantic-layer-grounded marketing analytics agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Camilo" }
]
dependencies = [
  "httpx>=0.28.1,<1.0",
  "pydantic>=2.13.5,<3.0",
  "pydantic-settings>=2.15.0,<3.0",
  "langchain-core (>=1.0,<2.0)",
  "langchain-openai (>=1.0,<2.0)",
  "langgraph (>=1.0,<2.0)",
  "langfuse (>=4.0,<5.0)",
  "langchain (>=1.4.1,<2.0.0)",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=6.0,<8.0",
  "respx>=0.22,<1.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
marketing-agent = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires locally running infrastructure",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.poetry]
packages = [
    { include = "app" }
]